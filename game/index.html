<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Twin Peeks — an original spot-the-difference game. Three hand-drawn scenes, eight differences each, against the clock.">
<title>Twin Peeks — Spot the Difference</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <div id="game-title">TWIN PEEKS</div>
      <div id="game-sub">Spot the Difference</div>
    </div>
    <div class="hud-mid">
      <div id="level-name">Level 1 · Maple Park Morning</div>
      <div id="timer-wrap" title="Time left">
        <div id="timer-fill"></div>
        <span id="timer-text">2:30</span>
      </div>
    </div>
    <div class="hud-right">
      <div class="stat"><span class="stat-label">Found</span><span id="found-count">0 of 8</span></div>
      <div class="stat"><span class="stat-label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="stat-label">Combo</span><span id="combo">×1</span></div>
      <button id="hint-btn" type="button" title="Hint (H)">💡 Hint <span id="hints-left">3</span></button>
      <button id="mute-btn" type="button" title="Mute (M)">🔊</button>
      <button id="restart-btn" type="button" title="Restart level (R)">↻</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="game" width="1280" height="500" aria-label="Twin Peeks: two near-identical pictures side by side. Click a difference in either picture to mark it."></canvas>
    <div id="overlay" class="hidden">
      <div id="overlay-card">
        <h1 id="overlay-title"></h1>
        <div id="overlay-body"></div>
        <div id="overlay-buttons">
          <button id="overlay-primary" type="button"></button>
          <button id="overlay-secondary" type="button" class="hidden"></button>
        </div>
        <p id="overlay-hint"></p>
      </div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <footer id="keys">
    <span>Click a difference in either picture</span>
    <span><b>H</b> hint</span>
    <span><b>M</b> mute</span>
    <span><b>R</b> restart level</span>
    <span><b>N</b> next level</span>
  </footer>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
